<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المهندس">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>شركة المهندس</title>
<style>
  :root { --ink:#1b2430; --mut:#64707f; --line:#e3e8ee; --brand:#0f766e; --brand2:#115e59; --bg:#f2f5f7; --warn:#b45309; --bad:#b91c1c; --ok:#15803d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:17px; line-height:1.6; padding-bottom:40px; }
  header { position:sticky; top:0; z-index:6; background:var(--brand); color:#fff; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand svg { width:40px; height:40px; flex:0 0 40px; }
  header h1 { font-size:19px; margin:0; font-weight:800; }
  .hd-right { display:flex; align-items:center; gap:8px; }
  #netState { font-size:13px; }
  #logoutBtn { background:transparent; border:2px solid #ffffffaa; color:#fff; border-radius:10px; padding:6px 12px; font-size:14px; width:auto; min-height:0; }
  nav { display:flex; overflow-x:auto; gap:8px; padding:10px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:66px; z-index:5; }
  nav button { width:auto; min-height:44px; padding:8px 16px; background:#e6ecf1; color:var(--ink); font-size:15px; white-space:nowrap; border-radius:999px; font-weight:700; }
  nav button.on { background:var(--brand); color:#fff; }
  main { padding:12px; max-width:760px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:0 1px 2px #0000000a; }
  h2 { font-size:20px; margin:0 0 12px; color:var(--brand2); }
  h3 { font-size:17px; margin:14px 0 8px; }
  label { display:block; font-size:16px; color:var(--ink); font-weight:700; margin-bottom:14px; }
  input, select, textarea { width:100%; margin-top:6px; padding:12px; font-size:17px; border:2px solid #cfd8e0; border-radius:12px; background:#fff; color:var(--ink); min-height:52px; font-weight:400; }
  input:focus, select:focus { outline:none; border-color:var(--brand); }
  input:disabled { background:#eef2f5; color:var(--mut); }
  input[type=checkbox] { width:24px; height:24px; min-height:0; margin:0; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  button { width:100%; min-height:54px; border:0; border-radius:14px; background:var(--brand); color:#fff; font-size:18px; font-weight:800; cursor:pointer; }
  button:disabled { background:#9aa5b1; }
  button.secondary { background:#e6ecf1; color:var(--ink); }
  button.small { width:auto; min-height:38px; font-size:14px; padding:6px 14px; border-radius:10px; }
  button.bad { background:var(--bad); }
  .preview { background:#eaf6f4; border:2px solid #b7e3dc; border-radius:12px; padding:12px; margin:4px 0 14px; font-weight:800; font-size:18px; color:var(--brand2); }
  .hint { color:var(--mut); font-size:14px; line-height:1.8; margin:8px 0 0; }
  .msg { color:var(--warn); font-size:15px; min-height:22px; margin-top:10px; font-weight:700; }
  .ok { color:var(--ok); }
  .tw { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; font-size:15px; min-width:360px; }
  th, td { padding:10px 8px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
  th { background:#f5f8fa; color:var(--mut); font-weight:800; font-size:14px; }
  td.nm { text-align:right; font-weight:700; }
  tr.total td { background:#eef6f5; font-weight:900; }
  .neg { color:var(--bad); font-weight:800; }
  .pos { color:var(--ok); font-weight:800; }
  .kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:12px; }
  .kpi div { background:#f5f8fa; border:1px solid var(--line); border-radius:14px; padding:12px; }
  .kpi span { display:block; font-size:14px; color:var(--mut); font-weight:700; }
  .kpi b { font-size:21px; color:var(--ink); }
  .rec { border:2px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .rec.pending { border-color:#f5c451; background:#fffbeb; }
  .rec.rejected { border-color:#fca5a5; background:#fef2f2; }
  .rec .top { display:flex; justify-content:space-between; gap:8px; font-weight:800; margin-bottom:4px; flex-wrap:wrap; }
  .badge { font-size:13px; font-weight:700; }
  .meta { font-size:14px; color:var(--mut); margin-top:4px; }
  .modal { position:fixed; inset:0; background:#0009; display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .modal.hidden { display:none; }
  .modal .sheet { background:#fff; width:100%; max-width:760px; border-radius:20px 20px 0 0; padding:18px; max-height:92vh; overflow:auto; padding-bottom:calc(18px + env(safe-area-inset-bottom)); }
  .check-row { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:700; margin-bottom:12px; }
  .check-row input { width:24px; height:24px; min-height:0; margin:0; }
  .hidden { display:none !important; }
  .section-gap { height:6px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span id="logo"></span>
    <h1 id="title">شركة المهندس</h1>
  </div>
  <div class="hd-right">
    <span id="netState"></span>
    <button id="logoutBtn" class="hidden">خروج</button>
  </div>
</header>
<nav id="nav" class="hidden"></nav>

<main>
  <section id="login" class="card hidden">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <label>كود المستخدم
        <input id="lcode" required autocomplete="username" placeholder="مثال: R001">
      </label>
      <label>الرقم السري
        <input id="lpin" type="password" inputmode="numeric" required autocomplete="current-password">
      </label>
      <label class="check-row"><input type="checkbox" id="showPin"> إظهار الرقم السري</label>
      <button type="submit">دخول</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </section>

  <div id="view"></div>
</main>

<div id="modal" class="modal hidden">
  <div class="sheet" id="modalBody"></div>
</div>

<script>
// ============ الإعدادات ============
// حط هنا لينك Apps Script (Web app URL)
const API_URL = 'PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';

// ============ أدوات ============
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const pct = n => (Number(n || 0) * 100).toFixed(1) + '%';
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const negCls = n => n < 0 ? 'neg' : '';

const LOGO = `<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <circle cx="256" cy="256" r="256" fill="#ffffff"/>
  <circle cx="256" cy="256" r="226" fill="#0f766e"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="8"/>
  <rect x="186" y="120" width="140" height="170" rx="16" fill="#ffffff"/>
  <rect x="210" y="158" width="92" height="14" rx="7" fill="#0f766e"/>
  <rect x="210" y="190" width="70" height="14" rx="7" fill="#7dd3c7"/>
  <rect x="210" y="222" width="82" height="14" rx="7" fill="#7dd3c7"/>
  <circle cx="352" cy="170" r="34" fill="#f59e0b"/>
  <text x="352" y="182" font-size="38" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="Tahoma, Arial, sans-serif">ج</text>
  <text x="256" y="350" font-size="62" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="Tahoma, Arial, sans-serif">المهندس</text>
  <text x="256" y="405" font-size="30" text-anchor="middle" fill="#ccfbf1" font-family="Tahoma, Arial, sans-serif">شركة</text>
</svg>`;
$('#logo').innerHTML = LOGO;

// ============ الحالة ============
let me = store.get('me', null);            // { code, name, role, pin }
let data = store.get('data', null);        // bootstrap
let reports = store.get('reports', null);  // تقارير المحاسب والمشرف
let queue = store.get('queue', []);        // المبيعات المستنية الإرسال
let page = '';
let invMap = {};
let invRep = '';
let syncing = false;

const saveQueue = () => store.set('queue', queue);

// ============ الصفحات حسب الدور ============
const TABS = {
  rep: [['sell','بيع'], ['totals','الإجمالي والتارجت'], ['stock','المخزن'], ['cash','الكاش'], ['debts','المديونيات']],
  supervisor: [['sup_sales','مبيعات الأصناف'], ['sup_stock','المخازن'], ['sup_target','التارجت'], ['sup_purch','المشتريات'], ['sup_main','المخزن الرئيسي'], ['sup_debts','الفواتير والمديونيات']],
  accountant: [['sell','بيع'], ['count','جرد'], ['loads','تحميل ومرتجع'], ['purch','مشتريات'], ['rep_report','تقرير المناديب'], ['stores','المخازن'], ['debts','المديونيات'], ['cash','الكاش اليوم'], ['invoices','الفواتير'], ['customers','العملاء'], ['settings','الإعدادات'], ['sheets','الشيتات']],
  manager: []
};
const FIRST_PAGE = { rep: 'sell', supervisor: 'sup_sales', accountant: 'sell', manager: 'owner' };

const PAY = [
  { k: 'cash',   label: 'كاش (خزينة)',       method: 'خزينة',              credit: false },
  { k: 'insta',  label: 'تحويل انستا باي',   method: 'انستا باي',          credit: false },
  { k: 'wallet', label: 'تحويل محفظة',       method: 'محفظة إلكترونية',    credit: false },
  { k: 'credit', label: 'آجل',               method: 'آجل',                credit: true  }
];
const METHOD_LIST = ['خزينة', 'انستا باي', 'محفظة إلكترونية', 'آجل'];

// ============ الاتصال ============
async function api(action, body = {}) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, code: me?.code, pin: me?.pin, ...body })
  });
  return r.json();
}

function table(head, rows, opts = {}) {
  const h = head ? `<thead><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr></thead>` : '';
  const b = rows.length ? rows.map(r => `<tr class="${r.cls || ''}">${r.cells.map((c, i) => `<td class="${i === 0 ? 'nm' : ''}">${c}</td>`).join('')}</tr>`).join('')
                        : `<tr><td colspan="${head ? head.length : 1}" class="hint">${opts.empty || 'مفيش بيانات'}</td></tr>`;
  return `<div class="tw"><table>${h}<tbody>${b}</tbody></table></div>`;
}

function kpis(items) {
  return `<div class="kpi">${items.map(i => `<div><span>${i[0]}</span><b class="${i[2] || ''}">${i[1]}</b></div>`).join('')}</div>`;
}

// ============ التنقل ============
function buildNav() {
  const tabs = TABS[me.role] || [];
  $('#nav').innerHTML = tabs.map(([p, t]) => `<button data-p="${p}">${t}</button>`).join('');
  $('#nav').classList.toggle('hidden', tabs.length === 0);
}

function go(p) {
  page = p;
  store.set('page', p);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  render();
}

function showLogin() {
  me = null; data = null; reports = null;
  store.set('me', null); store.set('data', null); store.set('reports', null);
  $('#login').classList.remove('hidden');
  $('#nav').classList.add('hidden');
  $('#logoutBtn').classList.add('hidden');
  $('#view').innerHTML = '';
  $('#title').textContent = 'شركة المهندس';
}

function showApp() {
  $('#login').classList.add('hidden');
  $('#logoutBtn').classList.remove('hidden');
  $('#title').textContent = (data?.name || me.name) + ' — شركة المهندس';
  buildNav();
  const saved = store.get('page', null);
  const valid = (TABS[me.role] || []).some(t => t[0] === saved) || (me.role === 'manager' && saved === 'owner');
  go(valid ? saved : FIRST_PAGE[me.role]);
}

// ============ تحميل البيانات ============
async function refreshAll() {
  if (!me) return;
  try {
    const b = await api('bootstrap');
    if (!b.ok) {
      if (b.error === 'bad_pin') { showLogin(); $('#loginMsg').textContent = 'الكود أو الرقم السري اتغير، ادخل تاني'; }
      return;
    }
    data = b; store.set('data', data);
    if (me.role === 'accountant' || me.role === 'supervisor') await loadReports();
  } catch (err) {
    $('#loginMsg').textContent = 'مفيش اتصال بالسيرفر: ' + err.message;
  }
  render();
  updateNet();
}

// تحميل التقارير، ولو فيه خطأ بيتعرض للمستخدم بدل ما الصفحة تفضل "جاري التحميل"
let reportsErr = '';
async function loadReports() {
  try {
    const r = await api('reports');
    if (r.ok) { reports = r; reportsErr = ''; store.set('reports', reports); }
    else reportsErr = r.error || 'خطأ غير معروف';
  } catch (err) {
    reportsErr = 'مفيش اتصال بالسيرفر: ' + err.message;
  }
}

// ============ رسم الصفحة ============
const PAGES = {
  owner: pgOwner,
  sell: pgSell, totals: pgRepTotals, stock: pgRepStock, cash: pgCash, debts: pgDebts,
  count: pgCount, loads: pgLoads, purch: pgPurch, rep_report: pgRepReport, stores: pgStores,
  invoices: pgInvoices, customers: pgCustomers, settings: pgSettings, sheets: pgSheets,
  sup_sales: pgSupSales, sup_stock: pgSupStock, sup_target: pgSupTarget, sup_purch: pgSupPurch,
  sup_main: pgSupMain, sup_debts: pgDebts
};

function render() {
  if (!me) return;
  const fn = PAGES[page];
  if (!fn) return;
  if (!data) { $('#view').innerHTML = '<p class="hint">جاري التحميل...</p>'; return; }
  const needsReports = ['rep_report','stores','debts','sup_sales','sup_stock','sup_target','sup_purch','sup_main','sup_debts','count','loads','purch','cash'].includes(page);
  if (needsReports && !reports && me.role !== 'rep') {
    if (reportsErr) {
      $('#view').innerHTML = `<div class="card"><p class="msg">تعذر تحميل التقارير: ${esc(reportsErr)}</p>
        <button data-act="retryReports">إعادة المحاولة</button></div>`;
      return;
    }
    $('#view').innerHTML = '<p class="hint">جاري تحميل التقارير...</p>';
    loadReports().then(render);
    return;
  }
  $('#view').innerHTML = fn();
  afterRender();
}

function afterRender() {
  if (page === 'sell') updatePreview();
  if (page === 'invoices' && me.role === 'accountant') loadInvoices();
  if (page === 'loads') updateLoadInfo();
}

// ============ شاشة المدير (صاحب الشركة) ============
function pgOwner() {
  const eq = data.equation || { header: [], rows: [] };
  const rows = eq.rows.map(r => {
    const isTotal = /إجمالي|فرق/.test(r[0] + r[2]);
    return { cls: isTotal ? 'total' : '', cells: [esc(r[0]), esc(r[1]), esc(r[2]), esc(r[3])] };
  });
  return `<div class="card">
    <h2>معادلة الاستثمار</h2>
    ${table(['الأصول', 'القيمة (ج.م)', 'الخصوم وحقوق الملكية', 'القيمة (ج.م)'], rows, { empty: 'مفيش بيانات' })}
    <p class="hint">المعادلة متوازنة لما فرق الميزان يساوي صفر.</p>
  </div>`;
}

// ============ البيع (المندوب والمحاسب) ============
function pgSell() {
  const isAcc = me.role === 'accountant';
  const locked = !!data.priceLocked && !isAcc;
  const custOpts = (data.customers || []).map(c => `<option value="${esc(c.code)} - ${esc(c.name)}"></option>`).join('');
  const itemOpts = (data.items || []).map(i => `<option value="${esc(i.code)}">${esc(i.name)}</option>`).join('');
  const repOpts = (data.reps || []).map(r => `<option value="${esc(r.code)}">${esc(r.name)}</option>`).join('');
  const payOpts = PAY.map(p => `<option value="${p.k}">${esc(p.label)}</option>`).join('');
  return `
  <div class="card">
    <h2>فاتورة بيع جديدة</h2>
    <form id="saleForm">
      ${isAcc ? `<label>المندوب<select name="rep">${repOpts}</select></label>
                 <label>التاريخ<input type="date" name="date" value="${todayStr()}" required></label>` : ''}
      <label>العميل
        <input name="cust" list="custList" required placeholder="اكتب الكود أو الاسم" autocomplete="off">
      </label>
      <datalist id="custList">${custOpts}</datalist>
      <label>الصنف<select name="item" required>${itemOpts}</select></label>
      <div class="row2">
        <label>كراتين<input name="ctn" type="number" min="0" inputmode="numeric" value="0"></label>
        <label>علب<input name="box" type="number" min="0" inputmode="numeric" value="0"></label>
      </div>
      <label>سعر الكرتونة (ج.م)
        <input name="price" type="number" min="0" step="0.5" inputmode="decimal" ${locked ? 'disabled' : ''}>
      </label>
      ${locked ? '<p class="hint">السعر محدد من الإدارة، مش هتقدر تغيّره.</p>' : ''}
      <label>نوع التحصيل<select name="pay">${payOpts}</select></label>
      <label>المدفوع الآن (ج.م)<input name="paid" type="number" min="0" step="0.5" inputmode="decimal" value="0"></label>
      <div class="preview" id="preview"></div>
      <button type="submit">حفظ الفاتورة</button>
      <div class="msg" id="formMsg"></div>
      <p class="hint">الكاش لازم يتسلّم في المكتب تاني يوم. التحويلات لازم المحاسب يأكدها. الآجل بيتسجل على العميل.</p>
    </form>
  </div>
  <div class="card"><h2>فواتير في الانتظار</h2><div id="queueList">${queueHtml()}</div></div>`;
}

function findCustByText(text) {
  const t = String(text).trim();
  return (data.customers || []).find(c => `${c.code} - ${c.name}` === t || c.code === t || c.name === t) || null;
}
function findItem(code) { return (data.items || []).find(i => i.code === code) || null; }

function updatePreview() {
  const f = $('#saleForm'); if (!f) return;
  const it = findItem(f.item.value);
  const per = it ? it.perCarton : 1;
  const locked = !!data.priceLocked && me.role !== 'accountant';
  const price = locked ? (it ? it.defaultPrice : 0) : num(f.price.value);
  const total = num(f.ctn.value) * price + num(f.box.value) * price / per;
  const pay = PAY.find(p => p.k === f.pay.value);
  if (pay && pay.credit) f.paid.value = 0;
  $('#preview').textContent = `الإجمالي: ${fmt(total)} ج.م`;
}

function queueHtml() {
  const mine = queue.filter(q => me.role === 'accountant' ? true : q.repCode === me.code).filter(q => q.status !== 'synced').slice(0, 30);
  if (!mine.length) return '<p class="hint">مفيش فواتير مستنية</p>';
  return mine.map(q => `
    <div class="rec ${q.status}">
      <div class="top"><span>${esc(q.repName)}</span><span class="badge">${badge(q)}</span></div>
      <div>${esc(q.custName)} — ${esc(q.itemName)}</div>
      <div class="meta">${q.ctn} ك + ${q.box} ع · ${fmt(q.total)} ج.م · مدفوع ${fmt(q.paid)} · ${esc(q.method)}</div>
    </div>`).join('');
}

function badge(q) {
  if (q.status === 'pending') return '⏳ مستنية الإرسال';
  if (q.status === 'synced') return '🔒 اتسجلت';
  return '⚠ اترفضت: ' + esc(q.error);
}

// ============ إرسال المبيعات ============
async function syncQueue() {
  if (syncing || !me || !navigator.onLine || API_URL.startsWith('PASTE')) { updateNet(); return; }
  syncing = true;
  try {
    for (const q of queue.filter(x => x.status === 'pending')) {
      let res;
      try { res = await api('sale', q.payload); } catch { break; }
      if (res.ok) { q.status = 'synced'; q.error = ''; q.total = res.total ?? q.total; }
      else if (res.error === 'bad_pin') { showLogin(); break; }
      else { q.status = 'rejected'; q.error = res.error || 'خطأ'; }
      saveQueue();
    }
    if (queue.some(x => x.status === 'synced')) {
      queue = queue.filter(x => x.status !== 'synced' || Date.now() - (x.at || 0) < 600000);
      saveQueue();
      await refreshAll();
    }
  } finally {
    syncing = false;
    if (page === 'sell') { const q = $('#queueList'); if (q) q.innerHTML = queueHtml(); }
    updateNet();
  }
}

function updateNet() {
  const n = queue.filter(q => q.status === 'pending').length;
  $('#netState').textContent = (navigator.onLine ? '🟢' : '🔴 بدون نت') + (n ? ` · ${n} مستنية` : '');
}

  if (!res.ok) { $('#invBox').innerHTML = `<p class="msg">${esc(res.error)}</p>`; return; }
  invMap = {};
  res.invoices.forEach(i => { invMap[i.row] = i; });

  const rows = res.invoices.map(i => {

  if (!res.ok) { $('#viewBox').innerHTML = `<p class="msg">${esc(res.error)}</p>`; return; }
  if (!res.rows.length) { $('#viewBox').innerHTML = '<p class="hint">الشيت ده فاضي</p>'; return; }
  $('#viewBox').innerHTML = `<div class="tw"><table>${res.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`
    + (res.truncated ? `<p class="hint">بيتعرض أول ${res.rowCount} صف وأول 25 عمود بس.</p>` : '');
}

// ============ تقارير المشرف ============
function pgSupSales() { return salesItemsHtml() || '<p class="hint">مفيش بيانات</p>'; }
function pgSupStock() { return stocksHtml() || '<p class="hint">مفيش بيانات</p>'; }

function pgSupTarget() {
  const rows = (reports?.targets || []).map(x => ({ cells: [
    esc(x.name), fmt(x.total), x.target ? fmt(x.target) : '—', x.target ? pct(x.pct) : '—',
    x.target ? fmt(x.remain) : '—', x.daysLeft, x.target ? fmt(x.perDay) : '—'
  ]}));
  return `<div class="card"><h2>التارجت والتوزيع على الأيام</h2>
    ${table(['المندوب', 'إجمالي البيع', 'التارجت', 'النسبة', 'الباقي', 'الأيام الباقية', 'المطلوب يومياً'], rows)}
    <p class="hint">المطلوب يومياً = الباقي ÷ الأيام المتبقية في الشهر (شامل النهارده).</p>
  </div>`;
}

function pgSupPurch() {
  const list = reports?.purchaseInvoices || [];
  const rows = [];
  list.forEach(inv => inv.lines.forEach(l => rows.push({ cells: [
    esc(inv.inv), esc(l.date), esc(inv.supName), esc(l.itemName), fmt(l.ctn), fmt(l.box), fmt(l.price), fmt(l.lineTotal)
  ]})));
  return `<div class="card"><h2>مشتريات الفرع</h2>
    ${table(['الفاتورة', 'التاريخ', 'المورد', 'الصنف', 'ك', 'ع', 'سعر الكرتونة', 'القيمة'], rows)}
    <p class="hint">إجمالي المشتريات: <b>${fmt(reports?.purchaseTotal || 0)} ج.م</b></p>
  </div>`;
}

function pgSupMain() { return mainHtml(); }

// ============ أحداث الصفحة ============
document.addEventListener('click', async e => {
  const nav = e.target.closest('nav button');
  if (nav) { go(nav.dataset.p); return; }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;

  if (a === 'reqHand') {
    act.disabled = true;
    const res = await api('requestHandover');
    if (!res.ok) alert(res.error);
    await refreshAll();
  }
  if (a === 'confirmHand') {
    act.disabled = true;
    const res = await api('confirmHandover', { id: act.dataset.id });
    if (!res.ok) alert(res.error);
    await refreshAll();
  }
  if (a === 'confirmTrans') {
    const rep = act.dataset.rep;
    const rows = [...document.querySelectorAll(`input[data-trans="${rep}"]:checked`)].map(c => ({ row: c.dataset.row, inv: c.dataset.inv }));
    if (!rows.length) { alert('اختار فاتورة واحدة على الأقل'); return; }
    act.disabled = true;
    const res = await api('confirmTransfers', { repCode: rep, rows });
    if (!res.ok) alert(res.error);
    await refreshAll();
  }
  if (a === 'editInv') {
    const i = invMap[act.dataset.row];
    if (!i) return;
    const mOpts = METHOD_LIST.map(m => `<option ${m === i.method ? 'selected' : ''}>${esc(m)}</option>`).join('');
    $('#modalBody').innerHTML = `
      <h2>تعديل فاتورة ${esc(i.inv)}</h2>
      <form id="editForm" data-row="${i.row}" data-inv="${esc(i.inv)}">
        <div class="row2">
          <label>التاريخ<input type="date" name="date" value="${esc(i.date)}" required></label>
          <label>كود العميل<input name="custCode" value="${esc(i.custCode)}" required></label>
        </div>
        <label>كود الصنف<input name="itemCode" value="${esc(i.itemCode)}" required></label>
        <div class="row2">
          <label>كراتين<input name="cartons" type="number" min="0" value="${i.ctn}"></label>
          <label>علب<input name="boxes" type="number" min="0" value="${i.box}"></label>
        </div>
        <div class="row2">
          <label>سعر الكرتونة<input name="price" type="number" min="0" step="0.5" value="${i.price}"></label>
          <label>المدفوع<input name="paid" type="number" min="0" step="0.5" value="${i.paid}"></label>
        </div>
        <label>نوع التحصيل<select name="method">${mOpts}</select></label>
        <button type="submit">حفظ التعديل</button>
        <button type="button" class="secondary" data-act="closeModal" style="margin-top:8px">إلغاء</button>
        <div class="msg" id="editMsg"></div>
      </form>`;
    $('#modal').classList.remove('hidden');
  }
  if (a === 'closeModal') $('#modal').classList.add('hidden');
  if (a === 'retryReports') { act.disabled = true; await loadReports(); render(); }
  if (a === 'saveCount') await saveCount();
  if (a === 'addLine') { $('#lines').insertAdjacentHTML('beforeend', lineHtml(0)); }
  if (a === 'delLine') {
    const all = document.querySelectorAll('[data-line]');
    if (all.length > 1) act.closest('[data-line]').remove();
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'saleForm' || t.closest?.('#saleForm')) { updatePreview(); }
  if (t.dataset.rerender) {
    invRep = t.value;
    if (t.dataset.rerender === 'invoices') { loadInvoices(); return; }
    render();
    return;
  }
  if (t.dataset.cust) {
    const res = await api('setCustomer', { custCode: t.dataset.cust, allowed: t.checked });
    if (!res.ok) { alert(res.error); t.checked = !t.checked; return; }
    const c = (data.customers || []).find(x => x.code === t.dataset.cust);
    if (c) c.allowed = t.checked;
    store.set('data', data);
  }
  if (t.id === 'priceLock') {
    const res = await api('setSetting', { key: 'PRICE_LOCKED', value: t.checked });
    $('#setMsg').textContent = res.ok ? 'تم الحفظ' : (res.error || 'خطأ');
    if (!res.ok) t.checked = !t.checked; else { data.priceLocked = t.checked; store.set('data', data); }
  }
  if (t.id === 'viewSel') loadSheetView(t.value);
  if (t.name === 'item' && t.closest('#loadForm')) updateLoadInfo();
  if (t.closest?.('#loadForm') && (t.name === 'rep' || t.name === 'item')) updateLoadInfo();
  if (t.name === 'pay' && t.closest?.('#saleForm')) updatePreview();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest?.('#saleForm')) updatePreview();
  if (t.dataset.f && t.dataset.code) updateCountDiff(t.dataset.code);
  if (t.id === 'custSearch') drawCustomers();
});

document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'loginForm') return;   // بيتعالج تحت
  e.preventDefault();
  if (f.id === 'saleForm') await submitSale(f);
  if (f.id === 'loadForm') await submitLoad(f);
  if (f.id === 'purchForm') await submitPurch(f);
  if (f.id === 'handForm') await submitHand(f);
  if (f.id === 'lockForm') await submitLock(f);
  if (f.id === 'editForm') await submitEdit(f);
});

// ============ الدخول ============
$('#showPin').addEventListener('change', e => { $('#lpin').type = e.target.checked ? 'text' : 'password'; });

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginMsg').textContent = '';
  const code = $('#lcode').value.trim();
  const pin = $('#lpin').value.trim();
  try {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'login', code, pin })
    }).then(r => r.json());
    if (!res.ok) { $('#loginMsg').textContent = 'الكود أو الرقم السري غلط'; return; }
    me = { code: res.code, name: res.name, role: res.role, pin };
    store.set('me', me);
    data = null; reports = null;
    $('#lpin').value = '';
    $('#showPin').checked = false; $('#lpin').type = 'password';
    $('#login').classList.add('hidden');
    await refreshAll();
    showApp();
    syncQueue();
  } catch {
    $('#loginMsg').textContent = 'مفيش اتصال بالنت، حاول تاني';
  }
});

$('#logoutBtn').addEventListener('click', () => {
  if (queue.some(q => q.status === 'pending')) { alert('فيه فواتير لسه مستنية الإرسال. استنى لحد ما تتبعت.'); return; }
  showLogin();
});

// ============ منطق الإرسال للفورمات ============
async function submitSale(f) {
  const msg = $('#formMsg'); msg.textContent = '';
  const cust = findCustByText(f.cust.value);
  if (!cust) { msg.textContent = 'اختار عميل من القائمة'; return; }
  const item = findItem(f.item.value);
  if (!item) { msg.textContent = 'اختار الصنف'; return; }
  const ctn = num(f.ctn.value), box = num(f.box.value);
  if (ctn === 0 && box === 0) { msg.textContent = 'اكتب كمية (كراتين أو علب)'; return; }
  const locked = !!data.priceLocked && me.role !== 'accountant';
  const price = locked ? item.defaultPrice : num(f.price.value);
  if (price <= 0) { msg.textContent = 'اكتب سعر الكرتونة'; return; }
  const pay = PAY.find(p => p.k === f.pay.value) || PAY[0];
  const paid = pay.credit ? 0 : num(f.paid.value);
  const isAcc = me.role === 'accountant';
  const repCode = isAcc ? f.rep.value : me.code;
  const repName = (data.reps || []).find(r => r.code === repCode)?.name || me.name;
  const date = isAcc ? f.date.value : todayStr();
  const total = ctn * price + box * price / item.perCarton;

  const payload = { id: newId(), date, custCode: cust.code, itemCode: item.code, cartons: ctn, boxes: box, price, paid, method: pay.method };
  if (isAcc) payload.targetRep = repCode;
  queue.unshift({ status: 'pending', error: '', at: Date.now(), repCode, repName, custName: cust.name, itemName: item.name,
                  ctn, box, total, paid, method: pay.method, payload });
  saveQueue();
  f.cust.value = ''; f.ctn.value = '0'; f.box.value = '0'; f.paid.value = '0';
  if (!locked) f.price.value = '';
  msg.textContent = 'اتحفظت، جاري الإرسال...';
  $('#queueList').innerHTML = queueHtml();
  updatePreview();
  syncQueue();
}

async function saveCount() {
  const repCode = $('[data-rerender="count"]').value;
  const items = [];
  (data.items || []).forEach(it => {
    const c = document.querySelector(`input[data-code="${it.code}"][data-f="ctn"]`);
    const b = document.querySelector(`input[data-code="${it.code}"][data-f="box"]`);
    if ((c && c.value !== '') || (b && b.value !== '')) items.push({ code: it.code, ctn: num(c?.value), box: num(b?.value) });
  });
  if (!items.length) { $('#countMsg').textContent = 'اكتب الجرد لصنف واحد على الأقل'; return; }
  const res = await api('saveCount', { repCode, items });
  if (!res.ok) { $('#countMsg').textContent = res.error; return; }
  $('#countMsg').textContent = 'تم حفظ الجرد';
  $('#countResult').innerHTML = table(['الصنف', 'المتاح ك', 'المتاح ع', 'الجرد ك', 'الجرد ع', 'فرق ك', 'فرق ع'],
    res.results.map(r => ({ cells: [esc(r.name), fmt(r.stockCtn), fmt(r.stockBox), fmt(r.countCtn), fmt(r.countBox),
      `<span class="${r.diffCtn < 0 ? 'neg' : (r.diffCtn > 0 ? 'pos' : '')}">${fmt(r.diffCtn)}</span>`,
      `<span class="${r.diffBox < 0 ? 'neg' : (r.diffBox > 0 ? 'pos' : '')}">${fmt(r.diffBox)}</span>`] })));
  await refreshAll();
}

function updateCountDiff(code) {
  const it = findItem(code);
  if (!it) return;
  const repCode = $('[data-rerender="count"]').value;
  const st = stockOf(repCode).find(s => s.name === it.name) || { ctn: 0, box: 0 };
  const c = document.querySelector(`input[data-code="${code}"][data-f="ctn"]`);
  const b = document.querySelector(`input[data-code="${code}"][data-f="box"]`);
  if (!c || !b) return;
  const dc = num(c.value) - st.ctn, db = num(b.value) - st.box;
  const cell = document.querySelector(`[data-diff="${code}"]`);
  if (c.value === '' && b.value === '') { cell.textContent = '—'; return; }
  const txt = `ك ${fmt(dc)} · ع ${fmt(db)}`;
  cell.innerHTML = `<span class="${(dc < 0 || db < 0) ? 'neg' : ((dc > 0 || db > 0) ? 'pos' : '')}">${txt}</span>`;
}

async function submitLoad(f) {
  const msg = $('#loadMsg'); msg.textContent = '';
  const res = await api('addLoad', {
    repCode: f.rep.value, type: f.type.value, date: f.date.value, itemCode: f.item.value,
    cartons: num(f.ctn.value), boxes: num(f.box.value), note: f.note.value
  });
  msg.textContent = res.ok ? 'تم الحفظ' : (res.error || 'خطأ');
  if (res.ok) { f.ctn.value = '0'; f.box.value = '0'; f.note.value = ''; await refreshAll(); }
}

async function submitPurch(f) {
  const msg = $('#purchMsg'); msg.textContent = '';
  const lines = [...document.querySelectorAll('[data-line]')].map(l => ({
    itemCode: l.querySelector('[data-f="item"]').value,
    ctn: num(l.querySelector('[data-f="ctn"]').value),
    box: num(l.querySelector('[data-f="box"]').value),
    price: num(l.querySelector('[data-f="price"]').value)
  }));
  if (lines.some(l => l.price <= 0 && (l.ctn > 0 || l.box > 0))) { msg.textContent = 'اكتب سعر الكرتونة لكل صنف'; return; }
  const res = await api('addPurchase', {
    date: f.date.value, invoice: f.invoice.value, supCode: f.sup.value,
    method: f.method.value, paid: num(f.paid.value), lines
  });
  msg.textContent = res.ok ? `تم حفظ فاتورة ${res.invoice}` : (res.error || 'خطأ');
  if (res.ok) { f.invoice.value = ''; f.paid.value = '0'; await refreshAll(); }
}

async function submitHand(f) {
  const res = await api('addHandover', { repCode: f.rep.value, amount: num(f.amount.value), note: f.note.value });
  $('#handMsg').textContent = res.ok ? 'تم التسجيل' : (res.error || 'خطأ');
  if (res.ok) await refreshAll();
}

async function submitLock(f) {
  const res = await api('setSetting', { key: 'LOCK_BEFORE', value: f.lock.value });
  $('#setMsg').textContent = res.ok ? 'تم حفظ تاريخ القفل' : (res.error || 'خطأ');
  if (res.ok) await refreshAll();
}

async function submitEdit(f) {
  const res = await api('editSale', {
    repCode: invRep, row: Number(f.dataset.row), invoice: f.dataset.inv,
    fields: {
      date: f.date.value, custCode: f.custCode.value.trim(), itemCode: f.itemCode.value.trim(),
      cartons: num(f.cartons.value), boxes: num(f.boxes.value), price: num(f.price.value),
      paid: num(f.paid.value), method: f.method.value
    }
  });
  if (res.ok) { $('#modal').classList.add('hidden'); await refreshAll(); }
  else $('#editMsg').textContent = res.error === 'changed' ? 'الفاتورة اتغيرت، حدّث الصفحة' : (res.error || 'خطأ');
}

// ============ بدء التشغيل ============
if (me) {
  showApp();
  refreshAll().then(() => syncQueue());
} else {
  $('#login').classList.remove('hidden');
}
updateNet();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
